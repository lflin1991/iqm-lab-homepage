items:
- title:
    zh: 学术兴趣
    en: Academic interest
  description:
    zh: 对凝聚态物理、材料物理、计算材料或量子材料问题有兴趣。
    en: Interest in condensed matter physics, materials physics, computational materials, or quantum materials problems.
- title:
    zh: 学习意愿
    en: Willingness to learn
  description:
    zh: 愿意学习第一性原理计算、模型构建、数值模拟、数据分析和机器学习方法。
    en: Willing to learn first-principles calculations, model construction, numerical simulations, data analysis, and machine-learning methods.
- title:
    zh: 基本能力
    en: Basic background
  description:
    zh: 具备物理/材料/计算相关背景；有编程经验者优先，但不是硬性要求。
    en: A background in physics, materials, or computing; programming experience is a plus but not required.
recruiting_heading:
  zh: 招募对象
  en: Who we are recruiting
recruiting_text:
  zh: 博士后研究人员、博士生、硕士生、本科科研训练学生均欢迎咨询。
  en: PhD students, master students, undergraduate research interns, and postdoctoral researchers.
note:
  zh: 不要求一开始掌握所有工具，更看重好奇心、主动学习能力和长期投入。
  en: Curiosity, persistence, and willingness to learn are valued. Prior programming or simulation experience is helpful but not mandatory for junior students.
requirements_heading:
  zh: 希望你具备
  en: What we look for
apply_heading:
  zh: 如何联系
  en: How to apply
apply_text:
  zh: 请发送 CV 和简短研究兴趣说明至：
  en: 'Please send a CV and a brief statement of research interests to '
