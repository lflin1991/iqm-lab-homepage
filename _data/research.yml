items:
- title:
    zh: AI/ML 辅助量子材料发现
    en: AI/ML-assisted quantum materials discovery
  description:
    zh: 发展物理启发的机器学习思路，从计算数据中提取描述符、识别结构—性质关联，并服务于候选材料筛选。
    en: Physics-informed machine-learning approaches that extract descriptors from computational data, identify structure–property correlations, and support candidate materials screening.
- title:
    zh: 高温超导与强关联电子材料
    en: Superconductivity and correlated materials
  description:
    zh: 关注镍酸盐、铜氧化物及相关过渡金属化合物中的电子结构、磁序、轨道自由度与配对机制。
    en: Nickelates, cuprates, and transition-metal compounds; electronic structure, magnetic order, orbital physics, and pairing mechanisms.
- title:
    zh: 磁性、铁电性与多铁性
    en: Magnetism and multiferroicity
  description:
    zh: 研究过渡金属氧化物/氟化物中的交换作用、轨道有序、电荷有序、磁电耦合与非共线铁电性。
    en: Exchange interactions, charge/orbital ordering, magnetoelectric coupling, and noncollinear ferroelectricity in oxides and fluorides.
- title:
    zh: 计算方法与材料设计
    en: Computational materials theory
  description:
    zh: 结合 VASP、Wannier90、模型哈密顿量、DMRG 与 Lanczos 等方法，从计算结果中提取可解释的物理图像。
    en: First-principles calculations, Wannier-based modeling, model Hamiltonians, and many-body numerical simulations.
methods_heading:
  zh: 常用技术路线
  en: Methods
methods:
- AI/ML
